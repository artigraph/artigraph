[env]
PYRIGHT_PYTHON_IGNORE_WARNINGS = "true" # Avoid the update check, which requires network access
_.path = ["{{config_root}}/bin"]

[hooks]
enter = """
mise install
uv sync --all-extras
"""

[tools]
uv = "latest"

[settings]
lockfile = true
python.uv_venv_auto = "create|source"

[[watch_files]]
patterns = [".python-version", "pyproject.toml", "uv.lock"]
run = "uv sync --all-extras"

[tasks.check]
description = "Run all pre-commit checks"
quiet = true
run = "pre-commit run --all-files"

[tasks.playground-wheel]
description = "Build the Artigraph wheel served by the docs playground"
# A fixed version keeps the wheel name in docs/assets/playground/manifest.json stable.
env = { SETUPTOOLS_SCM_PRETEND_VERSION = "0.0.0+playground" }
run = "uv build --wheel --no-create-gitignore --out-dir docs/assets/playground/packages"

name: Documentation
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  MISE_LOCKED: "1"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mise and uv
        uses: jdx/mise-action@v5
        with:
          install_args: uv
      - name: Build docs
        run: |
          mise run playground-wheel
          uv run --frozen --all-extras zensical build --clean --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment

version: 2

updates:
  - package-ecosystem: uv # Updates pyproject.toml and uv.lock together.
    directory: /
    schedule:
      interval: weekly
      day: "monday"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "monday"
  - package-ecosystem: npm # The dashboard page; rebuild it (`mise run dashboard`) when updating.
    directory: /tools/dashboard
    schedule:
      interval: weekly
      day: "monday"

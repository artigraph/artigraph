default_install_hook_types: [pre-commit, pre-merge-commit, pre-push, prepare-commit-msg]
default_stages: [manual, pre-commit, pre-merge-commit]
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: check-dco-sign-off
        name: check DCO sign-off
        entry: bin/check-dco-signoff.sh
        stages: [prepare-commit-msg]
        language: system
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: pretty-format-json
        args: [--autofix]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv lock
        files: ^(pyproject\.toml|uv\.lock|uv\.toml)$
        language: system
        pass_filenames: false
      - id: uv-sync # Runs before the hooks below to install/update their tools.
        name: uv sync
        entry: uv sync
        args: ["--all-extras", "--frozen"]
        files: ^uv\.lock$
        language: system
        pass_filenames: false
      - id: codespell
        name: codespell
        entry: codespell
        language: system
        types: [text]
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        require_serial: true
        types_or: [python, pyi, jupyter]
        exclude: ^stubs/
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        require_serial: true
        types_or: [python, pyi, jupyter]
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        types_or: [python]

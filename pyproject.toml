[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
docs = [
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.51",
]
dev = [
    { include-group = "docs" },
    "codespell",
    "coverage",
    "duckdb",
    "gcp-storage-emulator",
    "hypothesis",
    "ipdb",
    "ipython",
    "pandas-stubs",
    "pre-commit",
    "pyarrow-stubs",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-pretty",
    "ruff",
    "sh",
    "testcontainers[postgres]",
    "typer",
    "types-pyfarmhash",
]

[project]
authors = [{ name = "Jacob Hayes", email = "jacob.r.hayes@gmail.com" }]
dependencies = [
    "annotated-types",
    "parse",
    "pydantic>=2.14.1,<3",
    "pyfarmhash",
]
description = "Artigraph is a tool to improve the authorship, management, and quality of data."
dynamic = ["version"]
license = "Apache-2.0"
name = "arti"
readme = "README.md"
requires-python = ">=3.13"

[project.optional-dependencies]
all = [
    "alembic",
    "gcsfs",
    "google-cloud-bigquery",
    "numpy",
    "pandas",
    "psycopg[binary]",
    "pyarrow",
    "sqlalchemy>=2",
]
parquet = ["pandas", "pyarrow"]
postgres = ["alembic", "psycopg[binary]", "sqlalchemy>=2"]
sqlite = ["alembic", "sqlalchemy>=2"]

[project.urls]
Documentation = "https://artigraph.github.io/artigraph/"
Homepage = "https://github.com/artigraph/artigraph"
Repository = "https://github.com/artigraph/artigraph"


[tool.codespell]
ignore-words-list = ["nd"] # ordinal suffix
skip = ["./site", "stubs/*"] # ./site: docs build output


[tool.coverage.report]
exclude_lines = [
    "@overload",
    "coverage: ignore",
    "if TYPE_CHECKING:",
    "if not TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplemented",
    "raise NotImplementedError",
]
fail_under = 100
skip_covered = true

[tool.coverage.run]
branch = true
source = ["arti"]

[tool.hatch.build.targets.sdist]
packages = ["src/arti"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"


[tool.pyright]
enableExperimentalFeatures = true
include = ["bin/", "docs/", "src/", "tests/"]
reportImplicitStringConcatenation = true
reportUnnecessaryTypeIgnoreComment = true
stubPath = "stubs"
typeCheckingMode = "strict"



[tool.pytest]
addopts = [
    "--cov",
    "--cov-report=term-missing",
    "--doctest-modules",
    "--durations=5",
    "--ignore-glob=src/arti/backends/sql/migrations/*",
    "--ignore-glob=tests/arti/internal/import_submodules_test_modules/",
    "--no-cov-on-fail",
]
filterwarnings = [
    "error",
    # Ignore uncompiled crc32c warning from gcp-storage-emulator - https://github.com/oittaa/gcp-storage-emulator/pull/217
    "ignore:As the c extension couldn't be imported:RuntimeWarning:google_crc32c",
    # Ignore a couple external tools that use old form namespace packages
    "ignore:Deprecated call to `pkg_resources.declare_namespace.*:DeprecationWarning",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    # Ignore other upstream DeprecationWarnings
    "ignore:Type google._upb._message..* uses PyType_Spec with a metaclass.*:DeprecationWarning",
]
strict = true
testpaths = ["src/", "tests/"]


[tool.ruff]
extend-exclude = ["stubs/*"]
fix = true
force-exclude = true
line-length = 100
src = ["bin/", "src/", "tests/"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "ASYNC", # check for blocking calls in async funcs
    "B",     # bugbear
    "BLE",   # prevent bare `except:`
    "C4",    # standardize comprehensions
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "ERA",   # prevent commented out code
    "EXE",   # check executables/shebangs
    "F",     # pyflakes
    "I",     # isort
    "ISC",   # disable implicit str concat
    "N",     # naming conventions
    "PGH",   # pygrep-hooks
    "PIE",   # misc tidy checks
    "PT",    # standardize pytest usage
    "PTH",   # prefer pathlib.Path over os.path ops
    "RET",   # standardize return (or not)
    "RUF",   # misc ruff checks
    "S",     # bandit
    "SIM",   # simplify code when possible
    "UP",    # pyupgrade
    "W",     # pycodestyle
]
ignore = [
    "B008", # don't call function in arg defaults (eg: InputFingerprint or PartitionKey)
    "D100", # undocumented public module
    "D101", # undocumented public class
    "D102", # undocumented public method
    "D103", # undocumented public function
    "D104", # undocumented public package
    "D105", # undocumented magic method
    "D106", # undocumented public nested class
    "D107", # undocumented public __init__
    "D203", # prefer D211 (no blank line before class docstring)
    "D212", # prefer D213 (summary on second line)
    "D400", # redundant with D415
    "E501", # line too long (covered by `ruff format`, except intentionally long strings)
    "S101", # use of assert (used for type checker type narrowing)
]
flake8-implicit-str-concat = { allow-multiline = false }
isort = { known-first-party = ["tests"] }
pyupgrade = { keep-runtime-typing = true } # Preserve types, even if a file imports `from __future__ import annotations`.

[tool.ruff.lint.per-file-ignores]
"src/arti/internal/mappings.py" = ["N801"] # Preserve the dict-compatible public API
"src/arti/internal/type_hints.py" = ["ERA001", "N802"] # Typing examples and typing API names
"src/arti/partitions/__init__.py" = ["N801", "N802", "N805"] # Public partition component names
"src/arti/statistics/__init__.py" = ["ERA001"] # Planned model sketches
"src/arti/types/bigquery.py" = ["N801"] # Match BigQuery's constant naming
"src/arti/types/numpy.py" = ["ERA001"] # Unsupported NumPy type inventory
"src/arti/types/pyarrow.py" = ["ERA001", "N805"] # PyArrow inventory and class properties
"tests/*" = [
    "B018",   # disable "Found useless expression"
    "N802",   # disable "Function name `...` should be lowercase" when testing classes or writing fixtures
    "N803",   # preserve pytest fixture names
    "N805",   # exercise deliberately invalid method signatures
    "S301",   # disable pickle.load warnings
    "SIM117", # disable merging `with pytest.raises(...)` contexts with others in one line
]
"tests/arti/internal/test_type_hints.py" = ["UP045"] # Exercise Optional's runtime representation
"tests/arti/storage/test_storage.py" = ["S108"] # insecure usage of /tmp
